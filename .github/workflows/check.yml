name: Check

# 仓库公开，这里只检查能编译，不上传安装包
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a release commit for app changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 应用代码变了却没有 fix:/feat: 提交，release-please 就不会发版
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(lib|android|macos|windows|assets)/' \
            && ! git log --format=%s "$BASE..$HEAD" | grep -qE '^(feat|fix)(\(.+\))?!?: '; then
            echo "::error::改了应用代码，至少要有一个 fix: 或 feat: 开头的提交"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            args: apk --release --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true
          - platform: windows
            os: windows-latest
            args: windows --release
          - platform: macos
            os: macos-latest
            args: macos --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Build
        run: flutter build ${{ matrix.args }} -t lib/next/main.dart
